<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #010409; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00f0ff" />
    </marker>
    <marker id="arrow-magenta" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#bd00ff" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffb800" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff0033" />
    </marker>
  </defs>

  <rect width="1000" height="650" fill="#0d1117" />
  <rect width="1000" height="650" fill="url(#grid)" />

  <text x="500" y="45" text-anchor="middle" fill="#f3f4f6" font-size="24" font-weight="700" letter-spacing="1">AGENT ORCHESTRATION PIPELINE</text>
  <text x="500" y="70" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="400">State machine with immutable data flow, deterministic routing &amp; fail-safe logging</text>
  
  <rect x="360" y="90" width="280" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="500" y="107" text-anchor="middle" fill="#00f0ff" font-size="11" font-weight="600" font-family="monospace">STATUS: ACTIVE // EXECUTION: DETERMINISTIC</text>

  <path d="M 230 200 L 370 200" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 610 200 L 750 200" stroke="#bd00ff" stroke-width="2" marker-end="url(#arrow-magenta)"/>
  <path d="M 490 250 L 330 350" stroke="#bd00ff" stroke-width="2" marker-end="url(#arrow-magenta)"/>
  <path d="M 870 250 L 670 350" stroke="#00ff66" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <path d="M 110 250 L 110 520 L 150 520" stroke="#ff0033" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <path d="M 490 250 L 490 520 L 200 520" stroke="#ff0033" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 870 250 L 870 520 L 850 520" stroke="#ff0033" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>

  <g transform="translate(30, 150)">
    <rect width="200" height="100" rx="10" fill="#161b22" stroke="#00f0ff" stroke-width="2" filter="url(#glow-blue)"/>
    <text x="100" y="35" text-anchor="middle" fill="#00f0ff" font-size="15" font-weight="700">Validate Agent</text>
    <text x="100" y="60" text-anchor="middle" fill="#9ca3af" font-size="11">Check input schema &amp;</text>
    <text x="100" y="75" text-anchor="middle" fill="#9ca3af" font-size="11">data integrity</text>
  </g>

  <g transform="translate(390, 150)">
    <rect width="220" height="100" rx="10" fill="#161b22" stroke="#bd00ff" stroke-width="2" filter="url(#glow-magenta)"/>
    <text x="110" y="35" text-anchor="middle" fill="#bd00ff" font-size="15" font-weight="700">Enrich Agent</text>
    <text x="110" y="60" text-anchor="middle" fill="#9ca3af" font-size="11">Context synthesis &amp;</text>
    <text x="110" y="75" text-anchor="middle" fill="#9ca3af" font-size="11">payload extraction</text>
  </g>

  <g transform="translate(750, 150)">
    <rect width="220" height="100" rx="10" fill="#161b22" stroke="#00ff66" stroke-width="2" filter="url(#glow-green)"/>
    <text x="110" y="35" text-anchor="middle" fill="#00ff66" font-size="15" font-weight="700">Generate Agent</text>
    <text x="110" y="60" text-anchor="middle" fill="#9ca3af" font-size="11">Construct personalized</text>
    <text x="110" y="75" text-anchor="middle" fill="#9ca3af" font-size="11">response content</text>
  </g>

  <g transform="translate(210, 350)">
    <rect width="220" height="100" rx="10" fill="#161b22" stroke="#ffb800" stroke-width="2" filter="url(#glow-amber)"/>
    <text x="110" y="35" text-anchor="middle" fill="#ffb800" font-size="15" font-weight="700">Deliver Agent</text>
    <text x="110" y="60" text-anchor="middle" fill="#9ca3af" font-size="11">Multi-channel dispatch</text>
    <text x="110" y="75" text-anchor="middle" fill="#9ca3af" font-size="11">&amp; webhook output</text>
  </g>

  <g transform="translate(570, 350)">
    <rect width="220" height="100" rx="10" fill="#161b22" stroke="#ffb800" stroke-width="2" filter="url(#glow-amber)"/>
    <text x="110" y="35" text-anchor="middle" fill="#ffb800" font-size="15" font-weight="700">Analytics Agent</text>
    <text x="110" y="60" text-anchor="middle" fill="#9ca3af" font-size="11">Log telemetry metrics &amp;</text>
    <text x="110" y="75" text-anchor="middle" fill="#9ca3af" font-size="11">execution tracing</text>
  </g>

  <g transform="translate(150, 490)">
    <rect width="700" height="70" rx="10" fill="#1a0d13" stroke="#ff0033" stroke-width="2" filter="url(#glow-red)"/>
    <text x="350" y="32" text-anchor="middle" fill="#ff0033" font-size="15" font-weight="700">Fail-Safe Error Handler &amp; Fallback Logger</text>
    <text x="350" y="52" text-anchor="middle" fill="#9ca3af" font-size="11">Intercepts state collisions, logs exceptions, and reroutes failed tasks deterministically</text>
  </g>
</svg>
